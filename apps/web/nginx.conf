# What the Vite dev server did, rebuilt for the built app: `server.proxy` and
# `historyApiFallback` are dev-server features and do not survive `vite build`.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed filenames, so the file at a given name never changes.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html is the one file that must not be cached: it names the hashed
  # bundles, so a stale copy pins the browser to a deployment that is gone.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The trailing slash on proxy_pass is what strips the /api prefix, matching
  # the dev proxy's rewrite.
  location /api/ {
    proxy_pass http://api:3333/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The assistant answers as it writes (text/event-stream). Buffering here
    # would hold the whole answer back and hand it over in one piece, which
    # looks like a hang for as long as the model takes.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 10m;
  }

  # Every other path is the SPA's to route, so a deep link must not 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
