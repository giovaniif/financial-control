# How the app actually runs: two containers on this machine, supervised by the
# Coolify instance that is already here. Not a hosted environment — see
# .claude/deployment.md.
#
# The database is NOT here. It is a Coolify *managed* Postgres, which is what
# makes it eligible for Coolify's scheduled backups — a compose service is
# not. The API reaches it by its internal hostname on the `coolify` network,
# and `pnpm dev` still reaches it on 5434.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # No default: the host is the managed database's Coolify uuid, which is
      # generated rather than chosen, so there is nothing sensible to fall
      # back to. Set on the resource in Coolify.
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    # No published port. Nothing reaches the API except the web container,
    # which is what deployment.md already says about the dev setup: only the
    # web port needs to be open.
    #
    # The managed database lives on Coolify's own network, so the API joins it
    # as an external one. Declared external, never defined: this file must not
    # be able to create or remove the network the data sits on.
    networks:
      - default
      - coolify
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Migrations run before the server listens, so the first probe must not
      # be what decides the container is broken.
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # The one open port. Tailnet only — the app is unauthenticated, and
      # anything that reaches this can read and rewrite every figure in it.
      - '${WEB_PORT:-8090}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
  coolify:
    # Coolify's own network, where the managed database runs. External so that
    # bringing this stack down can never take it, or the database, with it.
    name: coolify
    external: true
