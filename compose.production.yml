# How the app actually runs: three containers on this machine, supervised by
# the Coolify instance that is already here. Not a hosted environment — see
# .claude/deployment.md.
#
# This is the only definition of the database. It publishes 5434 exactly as
# the development compose file used to, so `pnpm dev` reaches the same data
# through the same connection string — one machine, one user, one dataset.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fin}
      POSTGRES_DB: ${POSTGRES_DB:-fin}
    ports:
      # 5434, not 5432: this machine already runs other projects' databases on
      # 5432 and 5433. `pnpm dev` connects here.
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates fin_test beside fin on first boot. The tests truncate every
      # table, so they must never point at the development database.
      - ./scripts/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-fin} -d ${POSTGRES_DB:-fin}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Reached over the Docker network, so it is the container's own 5432 and
      # not the 5434 published to the host for `pnpm dev`.
      DATABASE_URL: ${DATABASE_URL:-postgresql://fin:fin@postgres:5432/fin?schema=public}
      PORT: 3333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    # No published port. Nothing reaches the API except the web container,
    # which is what deployment.md already says about the dev setup: only the
    # web port needs to be open.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Migrations run before the server listens, so the first probe must not
      # be what decides the container is broken.
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # The one open port. Tailnet only — the app is unauthenticated, and
      # anything that reaches this can read and rewrite every figure in it.
      - '${WEB_PORT:-8090}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # The data. Named rather than bound, so `docker compose down` cannot take it
  # and only an explicit `down -v` ever will.
  postgres-data:
